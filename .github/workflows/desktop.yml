name: Desktop CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "shared/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Shared + desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --no-daemon :shared:desktopTest :desktop:desktopTest

  package:
    name: Package ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (.msi)
            task: :desktop:packageMsi
            artifact: "desktop/build/compose/binaries/main/msi/*.msi"
          - os: windows-latest
            name: Windows (portable)
            task: :desktop:createDistributable
            artifact: "desktop/build/compose/binaries/main/app/KupuProxy/**"
          - os: ubuntu-latest
            name: Linux (.deb)
            task: :desktop:packageDeb
            artifact: "desktop/build/compose/binaries/main/deb/*.deb"
          - os: ubuntu-22.04
            name: Linux (tar.gz)
            task: :desktop:packageDistributionForCurrentOS
            artifact: "desktop/build/compose/binaries/main/tar/*.tar.gz"
          - os: macos-latest
            name: macOS (.dmg)
            task: :desktop:packageDmg
            artifact: "desktop/build/compose/binaries/main/dmg/*.dmg"

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Сборка .msi в jpackage требует WiX Toolset 3.x. На образах GitHub он обычно есть,
      # но ставим явно, чтобы шаг не зависел от состава образа.
      - name: Ensure WiX for MSI packaging
        if: runner.os == 'Windows' && endsWith(matrix.artifact, '.msi')
        shell: pwsh
        run: |
          $wix = Get-Command light.exe -ErrorAction SilentlyContinue
          if (-not $wix) {
            $candidates = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\*\bin\light.exe" -ErrorAction SilentlyContinue
            if ($candidates) {
              $bin = Split-Path -Parent $candidates[0].FullName
              Add-Content -Path $env:GITHUB_PATH -Value $bin
              Write-Host "WiX найден: $bin"
            } else {
              Write-Host "::warning::WiX не найден — сборка .msi упадёт"
            }
          } else {
            Write-Host "WiX уже в PATH: $($wix.Source)"
          }

      # jpackage требует JDK 17+ с полным набором инструментов сборки пакетов.
      - name: Package
        run: ./gradlew --no-daemon ${{ matrix.task }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: KupuProxy-desktop-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error