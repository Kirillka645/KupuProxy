name: Desktop CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew*"
      - "tools/release/**"
      - "docs/releases/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew*"
      - "tools/release/**"
      - "docs/releases/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Shared + desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Release tooling regression tests
        run: python -m unittest discover -s tools/release/tests -v

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :shared:desktopTest :desktop:desktopTest

  package:
    name: Package ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (.msi)
            task: :desktop:packageMsi
            ext: msi
          - os: windows-latest
            name: Windows (portable)
            task: :desktop:createDistributable
            fmt: zip
          - os: ubuntu-latest
            name: Linux (.deb)
            task: :desktop:packageDeb
            ext: deb
          # packageDistributionForCurrentOS на Linux собирает тот же .deb,
          # поэтому .tar.gz получаем из portable-образа.
          - os: ubuntu-latest
            name: Linux (tar.gz)
            task: :desktop:createDistributable
            fmt: targz
          - os: macos-latest
            name: macOS (.dmg)
            task: :desktop:packageDmg
            ext: dmg

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Install WiX 3.x
        if: runner.os == 'Windows' && matrix.ext == 'msi'
        shell: pwsh
        run: ./tools/release/setup-wix.ps1

      # jpackage требует JDK 17+ с полным набором инструментов сборки пакетов.
      - name: Package
        shell: bash
        env:
          # jpackage @args and Compose descriptions must use the same UTF-8 encoding.
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon ${{ matrix.task }}

      # Причина сбоя jpackage пишется в файл и не попадает в stdout.
      - name: Диагностика сбоя jpackage
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== содержимое desktop\build\compose ==="
          Get-ChildItem desktop\build\compose -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object -First 40 -ExpandProperty FullName
          Write-Host "=== логи jpackage ==="
          $logs = Get-ChildItem desktop\build\compose\logs -Recurse -File -ErrorAction SilentlyContinue
          if ($logs) {
            foreach ($f in $logs) {
              Write-Host "--- $($f.FullName) ---"
              Get-Content $f.FullName -Tail 60
            }
          } else {
            Write-Host "логи jpackage отсутствуют"
          }

      - name: Smoke-test portable launcher
        if: matrix.fmt == 'zip' || matrix.fmt == 'targz'
        shell: bash
        run: |
          version=$(sed -n 's/^kupuVersion=//p' gradle.properties)
          python tools/release/smoke_desktop.py --version "$version"

      - name: Stage artifact
        shell: bash
        env:
          EXT: ${{ matrix.ext }}
          FMT: ${{ matrix.fmt }}
          ARTIFACT: KupuProxy-desktop-${{ matrix.os }}-${{ strategy.job-index }}
        run: |
          python tools/release/stage_desktop.py --format "${FMT:-installer}" ${EXT:+--ext "$EXT"} --name "$ARTIFACT"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: KupuProxy-desktop-${{ matrix.os }}-${{ strategy.job-index }}
          path: staged/**
          if-no-files-found: error
  desktop-check:
    name: Desktop required checks
    if: always()
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require all platforms
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: test "$TEST_RESULT" = success && test "$PACKAGE_RESULT" = success
