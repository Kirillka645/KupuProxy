name: Desktop CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "shared/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "shared/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Shared + desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :shared:desktopTest :desktop:desktopTest

  package:
    name: Package ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (.msi)
            task: :desktop:packageMsi
            artifact: "desktop/build/compose/binaries/main/msi/*.msi"
            continue-on-error: true
          - os: windows-latest
            name: Windows (portable)
            task: :desktop:createDistributable
            artifact: "desktop/build/compose/binaries/main/app/KupuProxy/**"
          - os: ubuntu-latest
            name: Linux (.deb)
            task: :desktop:packageDeb
            artifact: "desktop/build/compose/binaries/main/deb/*.deb"
          - os: ubuntu-22.04
            name: Linux (tar.gz)
            task: :desktop:packageDistributionForCurrentOS
            artifact: "desktop/build/compose/binaries/main/tar/*.tar.gz"
          - os: macos-latest
            name: macOS (.dmg)
            task: :desktop:packageDmg
            artifact: "desktop/build/compose/binaries/main/dmg/*.dmg"

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Сборка .msi в jpackage требует WiX Toolset 3.x, которого на образе может не быть.
      # Ставим его; если не выйдет, .msi пропустим, а остальные форматы соберутся.
      - name: Установить WiX для сборки .msi
        if: runner.os == 'Windows' && endsWith(matrix.name, '.msi')
        shell: pwsh
        run: |
          if (Get-Command light.exe -ErrorAction SilentlyContinue) {
            Write-Host "WiX уже доступен"
            exit 0
          }
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\*\bin\light.exe" -ErrorAction SilentlyContinue
          if ($wix) {
            Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $wix[0].FullName)
            Write-Host "WiX найден"
            exit 0
          }
          Write-Host "::group::Устанавливаем WiX Toolset"
          choco install wixtoolset --yes --no-progress --limit-output
          choco install wixtoolset --version=3.11.2 --yes --no-progress --limit-output
          Write-Host "::endgroup::"
          $after = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\light.exe" -ErrorAction SilentlyContinue
          if ($after) {
            Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $after[0].FullName)
          } else {
            Write-Host "::warning::WiX установить не удалось — .msi будет пропущен"
          }

      # jpackage требует JDK 17+ с полным набором инструментов сборки пакетов.
      - name: Package
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon ${{ matrix.task }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: KupuProxy-desktop-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error