name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "proxy-feeds/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Release tooling regression tests
        run: python -m unittest discover -s tools/release/tests -v

      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: KupuProxy-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
