name: Publish release

# Release only after Android/shared/Desktop tests and ALL distribution jobs succeed.
# APK requires the existing developer keystore and a pinned certificate fingerprint.
# Never silently publish a partial release or sign with a runner-generated key.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег для публикации, например v1.4.0.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Проверить тег
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Тег должен совпадать с versionName
        id: check
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          declared=$(sed -n 's/^kupuVersion=//p' gradle.properties)
          if [ "$declared" != "$version" ]; then
            echo "::error::Тег $TAG не совпадает с versionName \"$declared\" в gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.KUPU_RELEASE_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.KUPU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KUPU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KUPU_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.KUPU_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing signing configuration: $key. See docs/releases/SIGNING.md"
              exit 1
            fi
          done

  quality:
    name: Release tests and lint
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Test and lint
        run: |
          chmod +x ./gradlew
          python -m unittest discover -s tools/release/tests -v
          ./gradlew --no-daemon :shared:desktopTest :desktop:desktopTest :app:testDebugUnitTest :app:lintDebug

  apk:
    name: Собрать Android APK
    needs: [verify, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Установить JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Восстановить ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.KUPU_RELEASE_KEYSTORE }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          echo "KUPU_KEYSTORE_PATH=$RUNNER_TEMP/keys/release.jks" >> "$GITHUB_ENV"

      - name: Собрать подписанный APK
        env:
          KUPU_KEYSTORE_PASSWORD: ${{ secrets.KUPU_KEYSTORE_PASSWORD }}
          KUPU_KEY_ALIAS: ${{ secrets.KUPU_KEY_ALIAS }}
          KUPU_KEY_PASSWORD: ${{ secrets.KUPU_KEY_PASSWORD }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p outputs
          apk="outputs/KupuProxy-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Verify APK certificate
        env:
          CERT_SHA256: ${{ vars.KUPU_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          python tools/release/verify_apk.py --apksigner "$signer" --apk "$APK_PATH" --expected "$CERT_SHA256"

      - name: Remove temporary keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Пересобрать манифест автообновления
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          APK_PATH: ${{ env.APK_PATH }}
        run: |
          set -euo pipefail
          notes="docs/releases/RELEASE_NOTES_${VERSION}.md"
          [ -f "$notes" ] || { echo "::error::Нет файла $notes"; exit 1; }
          changelog=$(sed -n '/^## 📦 Сборка/q;p' "$notes" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-900)
          pwsh -File tools/release/update-manifest.ps1 \
            -ApkPath "$APK_PATH" -Version "$VERSION" -Changelog "$changelog"

      - name: Сверить манифест с собранным APK
        run: |
          set -euo pipefail
          expected=$(python3 -c "import json;print(json.load(open('update_manifest.json'))['sha256'])")
          actual=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Манифест ($expected) не совпадает с APK ($actual)"
            exit 1
          fi
          echo "Манифест совпадает с APK: $actual"

      - name: Приложить ассеты релиза
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-apk
          path: |
            outputs/KupuProxy-v*.apk
            outputs/KupuProxy-v*.apk.sha256
            update_manifest.json
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: [verify, quality]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-msi
            task: :desktop:packageMsi
            ext: msi
          - os: windows-latest
            name: windows-portable
            task: :desktop:createDistributable
            fmt: zip
          - os: ubuntu-latest
            name: linux-deb
            task: :desktop:packageDeb
            ext: deb
          # packageDistributionForCurrentOS на Linux собирает тот же .deb,
          # поэтому .tar.gz получаем из portable-образа, как и Windows-архив.
          - os: ubuntu-latest
            name: linux-tar
            task: :desktop:createDistributable
            fmt: targz
          - os: macos-latest
            name: macos-dmg
            task: :desktop:packageDmg
            ext: dmg
          # Запускаемый jar для Windows (нужна установленная Java 17+). Skia-библиотеки
          # в uber-jar платформенные, поэтому собирается на Windows-раннере.
          - os: windows-latest
            name: windows-jar
            task: :desktop:packageUberJarForCurrentOS
            fmt: jar

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Установить JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Install WiX 3.x
        if: matrix.ext == 'msi'
        shell: pwsh
        run: ./tools/release/setup-wix.ps1

      - name: Собрать
        id: build
        shell: bash
        env:
          # jpackage читает сгенерированный файл @args в кодировке платформы, а
          # Compose-плагин пишет его в UTF-8. На Windows-раннере кодировка по
          # умолчанию windows-1252, где байты кириллицы и тире из --description
          # не определены: jpackage падает с «Input length = 1» ещё до сборки
          # образа приложения. UTF-8 выравнивает обе стороны.
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon ${{ matrix.task }}

      # jpackage пишет подробности сбоя в файл логов и не печатает их в stdout,
      # поэтому причина падения в CI не видна. Дублируем и логи, и содержимое
      # каталога сборки — по одному списку файлов причина тоже читается.
      - name: Диагностика сбоя jpackage
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== содержимое desktop\build\compose ==="
          Get-ChildItem desktop\build\compose -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object -First 40 -ExpandProperty FullName
          Write-Host "=== логи jpackage ==="
          $logs = Get-ChildItem desktop\build\compose\logs -Recurse -File -ErrorAction SilentlyContinue
          if ($logs) {
            foreach ($f in $logs) {
              Write-Host "--- $($f.FullName) ---"
              Get-Content $f.FullName -Tail 60
            }
          } else {
            Write-Host "логи jpackage отсутствуют"
          }
          Write-Host "=== версия JDK и jpackage ==="
          Write-Host (java -version 2>&1)
          Write-Host ("jdk.jpackage: " + (& "$env:JAVA_HOME\bin\jpackage.exe" --version 2>&1))

      - name: Smoke-test portable launcher
        if: matrix.fmt == 'zip' || matrix.fmt == 'targz'
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: python tools/release/smoke_desktop.py --version "$VERSION"

      - name: Собрать ассеты
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          EXT: ${{ matrix.ext }}
          FMT: ${{ matrix.fmt }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          case "$NAME" in
            windows-portable) platform=windows-x64 ;;
            windows-msi) platform=windows-x64 ;;
            windows-jar) platform=windows-x64 ;;
            linux-tar|linux-deb) platform=linux-x64 ;;
            macos-dmg) platform=macos ;;
            *) echo "::error::Unknown distribution $NAME"; exit 1 ;;
          esac
          python tools/release/stage_desktop.py --format "${FMT:-installer}" ${EXT:+--ext "$EXT"} \
            --name "KupuProxy-Desktop-${VERSION}-${platform}"

      - name: Загрузить артефакт
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-desktop-${{ matrix.name }}
          path: staged/**
          if-no-files-found: error

  publish:
    name: Опубликовать релиз
    permissions:
      contents: write
    needs: [verify, quality, desktop, apk]
    runs-on: ubuntu-latest
    # No always()/!cancelled() override: any required job failure blocks publication.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Скачать все ассеты
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Проверить состав
        run: |
          set -euo pipefail
          find dist -type f -printf '%p (%s байт)\n'
          VERSION="${{ needs.verify.outputs.version }}" python tools/release/verify_release.py dist
          cp dist/update_manifest.json update_manifest.json
          python - <<'PY_CHECKSUMS'
          import hashlib
          from pathlib import Path
          root = Path('dist')
          lines = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name
                   for p in sorted(root.iterdir()) if p.is_file() and p.name != 'SHA256SUMS']
          (root / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
          PY_CHECKSUMS

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes="docs/releases/RELEASE_NOTES_${TAG#v}.md"
          [ -f "$notes" ] || { echo "::error::Нет файла $notes"; exit 1; }

          mapfile -d '' assets < <(find dist -type f -print0)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Релиз $TAG уже существует — обновляем ассеты"
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --verify-tag \
              --title "$TAG" --notes-file "$notes" "${assets[@]}"
          fi

      - name: Закоммитить пересобранный манифест
        if: ${{ needs.apk.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- update_manifest.json; then
            echo "Манифест не изменился — коммитить нечего"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${{ github.event.repository.default_branch }}"
          # Чекаут сделан по тегу (detached HEAD), а в ветку по умолчанию за это время могли
          # прийти коммиты (зеркало proxy-feeds — каждые 4 часа). Прямой push HEAD:main
          # тогда отклоняется как non-fast-forward, поэтому коммитим поверх свежей ветки.
          cp update_manifest.json "$RUNNER_TEMP/update_manifest.json"
          git fetch --no-tags origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          declared=$(sed -n 's/^kupuVersion=//p' gradle.properties)
          if [ "$declared" != "${{ needs.verify.outputs.version }}" ]; then
            echo "::notice::Default branch version has moved; not overwriting its update manifest"
            exit 0
          fi
          cp "$RUNNER_TEMP/update_manifest.json" update_manifest.json
          if git diff --quiet -- update_manifest.json; then
            echo "Манифест в $branch уже актуален"
            exit 0
          fi
          git add update_manifest.json
          git commit -m "chore(release): обновить манифест автообновления"
          git push origin "HEAD:$branch"
          echo "Манифест закоммичен в ${{ github.event.repository.default_branch }}"